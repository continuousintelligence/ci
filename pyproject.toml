[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "continuousintelligence"
version = "0.1.0"
description = "Continuous Intelligence models"
readme = { text = "Continuous Intelligence models.", content-type = "text/markdown" }
license = "LicenseRef-ci-proto AND Apache-2.0 AND CC-BY-4.0"
license-files = [
    "LICENCE",
    "NOTICE",
    "src/continuousintelligence/_vendor/mamba3/LICENSE",
    "src/continuousintelligence/_data/NOTICE",
]
requires-python = ">=3.10,<3.15"
authors = [{ name = "Continuous Intelligence" }]
keywords = ["time-series", "forecasting", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.7,<3",
    "einops>=0.8,<1",
    "huggingface-hub>=1,<3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "matplotlib>=3.8,<4",
    "tilelang==0.1.8; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "apache-tvm-ffi==0.1.9; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cuda-toolkit[nvcc,cccl]==13.0.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.urls]
Repository = "https://github.com/continuousintelligence/ci"
Issues = "https://github.com/continuousintelligence/ci/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.18", "twine>=6,<8"]

[tool.uv]
required-version = ">=0.11.30"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"continuousintelligence" = ["_data/*.csv", "_data/NOTICE"]
"continuousintelligence._vendor.mamba3" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/continuousintelligence/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
